server:
  port: 8761

spring:
  application:
    name: EUREKA-SERVER

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

# ===== EUREKA SERVER CONFIG =====
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

  instance:
    hostname: ${EUREKA_HOST:localhost}